<style>
/* ───────── 색·크기 설정 (편안한 파스텔) ───────── */
:root{
  --bg:#FFF8EF; --card:#FFFFFF; --ink:#3E3A36; --sub:#8A8178; --line:#EFE4D6;
  --accent:#FF8A65; --accent-dk:#E86F4A; --accent-soft:#FFE6DA;
  --ok:#4FAF7E; --ok-soft:#DDF2E5; --ng:#E07070; --ng-soft:#FBE4E4;
  --on:#4F7FE0; --on-soft:#E4ECFC;     /* 음독 = 파랑 */
  --kun:#E07B2E; --kun-soft:#FDEBDB;   /* 훈독 = 주황 */
  --g1:#FFB4A2; --g2:#FFD59E; --g3:#B9E4C9; --g4:#A9D6F5; --g5:#CDB9F0; --g6:#F6BCD6;
  --r:18px; --jp:'Klee One','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:17px;line-height:1.6;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 80px);touch-action:manipulation;}
.jp{font-family:var(--jp);font-weight:600;}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px;}
.screen{display:none;} .screen.on{display:block;}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(120,90,60,.07);}
h2{font-size:1.15rem;margin-bottom:8px;} h3{font-size:1rem;margin:4px 0 8px;color:var(--sub);}
.muted{color:var(--sub);font-size:.9rem;}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-size:1.1rem;font-weight:bold;text-align:center;}
.btn.main{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-dk);}
.btn.main:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dk);}
.btn.sub{background:var(--accent-soft);color:var(--accent-dk);}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink);}
.btn+.btn{margin-top:10px;}
.row{display:flex;gap:10px;align-items:center;}
.grow{flex:1;}
/* 상단바 */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:560px;margin:0 auto;}
.topbar .title{font-weight:bold;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .iconbtn{width:40px;height:40px;flex:none;}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.82rem;font-weight:bold;}
.pill.kid{background:var(--g3);} .pill.adult{background:var(--g4);}
.iconbtn{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.3rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
/* 홈 */
.today{text-align:center;}
.today .big{font-size:2.6rem;font-weight:bold;line-height:1.2;}
.today .stat{display:flex;justify-content:center;gap:26px;margin:10px 0 16px;}
.today .stat b{display:block;font-size:1.9rem;}
.gbar{margin:10px 0;}
.gbar .lab{display:flex;justify-content:space-between;font-size:.9rem;}
.bar{height:12px;border-radius:99px;background:#F3EBE1;overflow:hidden;position:relative;}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;}
.bar i.seen{background:var(--accent-soft);} .bar i.mast{background:var(--ok);}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.menu button{background:#fff;border-radius:16px;padding:16px 8px;font-weight:bold;box-shadow:0 2px 8px rgba(120,90,60,.07);}
.menu button span{display:block;font-size:1.8rem;}
.stickers{font-size:1.8rem;letter-spacing:4px;word-break:break-all;}
.banner{background:#FFF3C4;border-radius:14px;padding:12px 14px;font-size:.92rem;margin:12px 0;}
/* 목록 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;}
.tabs button{padding:8px 14px;border-radius:99px;background:#fff;font-weight:bold;white-space:nowrap;border:2px solid transparent;}
.tabs button.on{border-color:var(--accent);background:var(--accent-soft);}
.tabs button.off{opacity:.45;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;}
.tile{background:#fff;border-radius:14px;padding:6px 2px;text-align:center;border:2px solid var(--line);position:relative;}
.tile .c{font-size:2.1rem;line-height:1.25;}
.tile .h{font-size:.68rem;color:var(--sub);white-space:nowrap;overflow:hidden;}
.tile.learn{background:var(--accent-soft);border-color:#FFD2BF;}
.tile.mast{background:var(--ok-soft);border-color:#B7E2C8;}

.legend{display:flex;gap:12px;font-size:.8rem;color:var(--sub);flex-wrap:wrap;margin:6px 0;}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:2px solid var(--line);}

.hero{text-align:center;}
.kbox{width:min(72vw,300px);margin:6px auto;background:#FFFDF8;border-radius:22px;border:3px solid var(--line);}
.ksvg{width:100%;display:block;}

.ksvg path{fill:none;stroke-linecap:round;stroke-linejoin:round;}
.ksvg .ghost path{stroke:#EDE6DD;stroke-width:4;}
.ksvg .strokes path{stroke:var(--ink);stroke-width:4;}
.ksvg .strokes path.cur{stroke:var(--accent);}

.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0;}
.chip{background:#F5EEE5;border-radius:99px;padding:3px 12px;font-size:.85rem;}
.hun{font-size:1.9rem;font-weight:bold;}

.ctrls{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap;}
.ctrls button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:bold;font-size:.95rem;}
.ctrls button.on{border-color:var(--accent);background:var(--accent-soft);}
.rdgrp{margin:6px 0 12px;}
.rdgrp .lab{font-size:.85rem;font-weight:bold;margin-bottom:4px;}
.rd{display:inline-flex;flex-direction:column;align-items:center;border-radius:14px;padding:6px 14px;margin:3px;font-size:1.3rem;min-width:62px;}

.exg{border-top:2px dashed var(--line);padding:10px 0;}
.exg:first-child{border-top:none;}
.exg .head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.tag{border-radius:8px;padding:1px 10px;font-weight:bold;font-size:1.05rem;}
.tag.on{background:var(--on-soft);color:var(--on);} .tag.kun{background:var(--kun-soft);color:var(--kun);}
.ex{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;width:100%;text-align:left;}
.ex:active{background:#F8F1E8;}
.ex .w{font-size:1.5rem;min-width:88px;}
.ex .y{font-size:1rem;} .ex .y small{display:block;font-size:.72rem;color:var(--sub);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
.ex .m{font-size:.88rem;color:var(--sub);flex:1;text-align:right;}
.hl-on{color:var(--on);font-weight:bold;} .hl-kun{color:var(--kun);font-weight:bold;}
.chg{font-size:.65rem;background:#F1E8FF;color:#7A58C0;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:2px;}
.tip{background:#FFF6D6;border-radius:12px;padding:10px 12px;font-size:.95rem;margin-top:8px;}
.box-o,.box-m{border-radius:14px;padding:12px 14px;margin:8px 0;font-size:.97rem;}
.box-o{background:#EEF6F0;} .box-m{background:#FFF0F4;}
.badge{display:inline-block;font-size:.75rem;font-weight:bold;border-radius:6px;padding:1px 8px;margin-bottom:4px;}
.b-o{background:#CFEAD9;color:#2F7A52;} .b-m{background:#FFD3DF;color:#B04468;}
details.adult{background:#EEF3FB;border-radius:14px;padding:10px 14px;margin-top:8px;font-size:.95rem;}
details.adult summary{font-weight:bold;cursor:pointer;}
.sp{display:flex;gap:10px;align-items:center;padding:6px 0;}
.sp .w{font-size:1.3rem;min-width:70px;}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 30%);}
.sticky .in{max-width:560px;margin:0 auto;}
.navlr{display:flex;gap:10px;}
/* 퀴즈 */
.qtop{display:flex;align-items:center;gap:10px;}
.qprog{flex:1;height:14px;border-radius:99px;background:#F1E8DD;overflow:hidden;}
.qprog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
.qask{text-align:center;color:var(--sub);margin:14px 0 6px;font-weight:bold;}
.qbig{text-align:center;font-size:7rem;line-height:1.15;}
.qword{text-align:center;font-size:3.4rem;line-height:1.3;}
.qhun{text-align:center;font-size:2.4rem;font-weight:bold;}
.qsub{text-align:center;color:var(--sub);}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.choice{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px 6px;font-size:1.35rem;font-weight:bold;min-height:78px;text-align:center;}
.choice.kan{font-size:2.6rem;padding:8px 6px;}
.choice small{display:block;font-size:.72rem;color:var(--sub);font-weight:normal;}
.choice.right{background:var(--ok-soft);border-color:var(--ok);}
.choice.wrong{background:var(--ng-soft);border-color:var(--ng);}
.speaker{display:block;margin:10px auto;width:120px;height:120px;border-radius:50%;background:var(--accent-soft);font-size:3.2rem;}
.fb{text-align:center;font-size:1.3rem;font-weight:bold;margin:14px 0 4px;min-height:1.6em;}
.fb.ok{color:var(--ok);} .fb.ng{color:var(--ng);}
.done{text-align:center;}
.done .st{font-size:5rem;animation:pop .6s;}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.menu .wide{grid-column:1/-1;}
/* 한 장 정리 */
.krow{display:grid;gap:6px;margin:6px 0;}
.krow.c5{grid-template-columns:repeat(5,1fr);} .krow.c3{grid-template-columns:repeat(3,1fr);} .krow.c4{grid-template-columns:repeat(4,1fr);}
.kc{background:#FFFDF8;border:2px solid var(--line);border-radius:12px;padding:6px 0 4px;font-size:1.7rem;line-height:1.2;text-align:center;}
.kc small{display:block;font-size:.7rem;color:var(--sub);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
.kstroke{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:440px;
  background:var(--card);border:2px solid var(--accent-soft);border-radius:var(--r);box-shadow:0 6px 24px rgba(60,45,30,.18);padding:8px 12px 10px;z-index:40;}
.kstroke .kshead{display:flex;align-items:center;gap:8px;font-size:.9rem;}
.kstroke .kshead .x{margin-left:auto;font-size:1.1rem;padding:2px 10px;}
.kstroke .ksrow{display:flex;justify-content:center;gap:4px;}
.kstroke .ksvg{width:150px;max-width:42vw;}
.kstroke .ksbtn{display:flex;gap:8px;justify-content:center;}
.kstroke .ksbtn button{background:var(--accent-soft);border-radius:12px;padding:6px 14px;font-size:.9rem;}
body.ks-open #scrSheet{padding-bottom:250px;}
.kc.empty{border:none;background:none;}
.kc:active{background:var(--accent-soft);}
details.cnt{border-top:1px dashed var(--line);padding:10px 0;}
details.cnt summary{cursor:pointer;font-weight:bold;}
tr.star td{background:#FFF6D6;}
.bar i.use{background:#9CC9F0;}
.tile.use{background:#DCEBFA;border-color:#B9D6F2;}
.chip.lv{background:#E4ECFC;color:var(--on);font-weight:bold;}
.rd.big{font-size:1.7rem;padding:8px 18px;}
details.more{margin-top:8px;} details.more summary{cursor:pointer;color:var(--sub);font-size:.9rem;}
.exrow{border-bottom:1px dashed var(--line);} .exrow:last-child{border-bottom:none;}
.krnote{background:#FFF0E6;color:#B4541F;border-radius:10px;padding:6px 10px;margin:0 6px 8px;font-size:.85rem;}
.sentbox{display:block;width:100%;text-align:left;background:#F4F8FF;border-radius:14px;padding:12px 14px;}
.sentbox .sj{font-size:1.35rem;line-height:1.5;} .sentbox .sj u{text-decoration-color:var(--accent);text-decoration-thickness:3px;}
.sentbox .sy{color:var(--sub);font-size:.95rem;margin-top:4px;} .sentbox .sk{margin-top:4px;}
.conf{display:grid;grid-template-columns:auto auto auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);}
.conf>span.jp,.conf .cf{font-size:2rem;} .conf .vs{color:var(--sub);} .conf .cf{background:#FFF6D6;border-radius:10px;padding:0 10px;}
.conf .cn{font-size:.88rem;color:var(--ink);}
details.fold summary{cursor:pointer;list-style:none;} details.fold summary::-webkit-details-marker{display:none;}
details.fold summary::after{content:' ▾';color:var(--sub);}
.badge.b-u{background:#FFE3C2;color:#A5520E;} .badge.b-t{background:#E4ECFC;color:#3A63B8;}
.lvtag{display:inline-block;background:#E4ECFC;color:var(--on);border-radius:8px;padding:0 8px;font-size:.78rem;}
.qsent{text-align:center;font-size:1.7rem;line-height:1.5;margin:10px 0;} .qsent u{text-decoration-color:var(--accent);text-decoration-thickness:3px;}
.srow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border-radius:14px;padding:10px 12px;margin:6px 0;box-shadow:0 1px 5px rgba(120,90,60,.07);}
.srow .c{font-size:2.2rem;min-width:52px;text-align:center;} .srow .t{font-size:.9rem;}
/* 표 */
table.t{width:100%;border-collapse:collapse;font-size:.92rem;}
table.t td,table.t th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;}
table.t th{color:var(--sub);font-size:.8rem;}
/* 연습 (가나·한자) */
.tog{display:inline-block;padding:7px 12px;border-radius:99px;border:2px solid var(--line);background:#fff;font-weight:bold;font-size:.88rem;margin:3px 2px;}
.tog.on{border-color:var(--accent);background:var(--accent-soft);}
.optrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0;}
.optrow .lab{font-size:.85rem;color:var(--sub);min-width:58px;font-weight:bold;}
.pstat{display:flex;justify-content:center;gap:18px;font-weight:bold;margin:4px 0;}
.pbig{text-align:center;font-size:6.5rem;line-height:1.2;}
.pword{text-align:center;font-size:3.2rem;line-height:1.3;}
/* 활용어 */
.gtab{font-size:.95rem;}
.gram h2{margin-top:2px;} .gram p{margin:6px 0;}
.gex{background:#F4F8FF;border-radius:12px;padding:8px 12px;margin:6px 0;display:block;width:100%;text-align:left;}
.gex .j{font-size:1.2rem;line-height:1.5;} .gex .y{color:var(--sub);font-size:.85rem;} .gex .k{font-size:.92rem;}

.gpat{border-bottom:1px dashed var(--line);padding:10px 0;} .gpat:last-child{border-bottom:none;}
.gpat .pt{font-size:1.25rem;font-weight:bold;} .gpat .cn{font-size:.85rem;color:var(--on);background:var(--on-soft);border-radius:8px;padding:1px 8px;display:inline-block;margin:2px 0;}
.lvb{font-size:.72rem;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:2px;font-weight:bold;}

table.cj td{vertical-align:top;} .gform{display:block;text-align:left;padding:2px;} table.cj small.kx{color:#B4541F;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
.gl{border-bottom:1.5px dotted var(--on);cursor:pointer;} table.cj .f{font-size:1.1rem;} table.cj small{display:block;color:var(--sub);font-size:.75rem;}
.vbox{border-bottom:1px dashed var(--line);} .vbox .vrow{border-bottom:none;} details.vcj{margin:0 0 6px 34px;} details.vcj summary{cursor:pointer;}

  // 박스별 다음 복습까지 일수: 0(오늘 조금 뒤)→1→3→7→14→30→60→120일 (틀리면 한 단계만 내려감)
  INTERVALS: [0, 1, 3, 7, 14, 30, 60, 120],
  MASTER_BOX: 5,            // 박스 5 이상(30일 간격 통과) + 숙련도 최고 단계 = '익힘'
  NEW_MAX: 10,              // 하루 새 한자 상한 (많이 보기보다 내일 기억하기)
  REVIEW_CAP: 60,           // 하루 최대 복습 수

/* ═══════════════ 공용 도구 ═══════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
// 오늘 날짜를 '일 번호'로 (현지 시간 기준, 자정에 바뀜)
function dayNum(d = new Date()) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800); }
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

/* 가나 → 한글 발음(참고용 근사치). か=카, が=가 로 청음/탁음을 구분해 표기 */
const KH = (() => {
  const base = {あ:'아',い:'이',う:'우',え:'에',お:'오',か:'카',き:'키',く:'쿠',け:'케',こ:'코',が:'가',ぎ:'기',ぐ:'구',げ:'게',ご:'고',
    さ:'사',し:'시',す:'스',せ:'세',そ:'소',ざ:'자',じ:'지',ず:'즈',ぜ:'제',ぞ:'조',た:'타',ち:'치',つ:'츠',て:'테',と:'토',
    だ:'다',ぢ:'지',づ:'즈',で:'데',ど:'도',な:'나',に:'니',ぬ:'누',ね:'네',の:'노',は:'하',ひ:'히',ふ:'후',へ:'헤',ほ:'호',
    ば:'바',び:'비',ぶ:'부',べ:'베',ぼ:'보',ぱ:'파',ぴ:'피',ぷ:'푸',ぺ:'페',ぽ:'포',ま:'마',み:'미',む:'무',め:'메',も:'모',
    や:'야',ゆ:'유',よ:'요',ら:'라',り:'리',る:'루',れ:'레',ろ:'로',わ:'와',を:'오',ー:'-'};
  const yo = {きゃ:'캬',きゅ:'큐',きょ:'쿄',ぎゃ:'갸',ぎゅ:'규',ぎょ:'교',しゃ:'샤',しゅ:'슈',しょ:'쇼',じゃ:'자',じゅ:'주',じょ:'조',
    ちゃ:'차',ちゅ:'추',ちょ:'초',にゃ:'냐',にゅ:'뉴',にょ:'뇨',ひゃ:'햐',ひゅ:'휴',ひょ:'효',びゃ:'뱌',びゅ:'뷰',びょ:'뵤',
    ぴゃ:'퍄',ぴゅ:'퓨',ぴょ:'표',みゃ:'먀',みゅ:'뮤',みょ:'묘',りゃ:'랴',りゅ:'류',りょ:'료',
    // 외래어 특수 표기 (가타카나 ファ·ティ 등)
    ふぁ:'파',ふぃ:'피',ふぇ:'페',ふぉ:'포',てぃ:'티',でぃ:'디',うぃ:'위',うぇ:'웨',うぉ:'워',しぇ:'셰',じぇ:'제',ちぇ:'체',ゔぁ:'바',ゔぃ:'비',ゔぇ:'베',ゔぉ:'보',ゔゅ:'뷰',
    つぁ:'차',つぃ:'치',つぇ:'체',つぉ:'초',とぅ:'투',どぅ:'두',てゅ:'튜',でゅ:'듀',ふゅ:'퓨',いぇ:'예',くぁ:'콰',くぃ:'퀴',くぇ:'퀘',くぉ:'쿼',ぐぁ:'과'};
  base['ゔ'] = '부';
  // 앞 글자에 받침 붙이기 (ㄴ=4, ㅅ=19)
  const addJong = (s, j) => { if (!s) return s; const c = s.charCodeAt(s.length - 1); if (c < 0xAC00 || c > 0xD7A3 || (c - 0xAC00) % 28) return s; return s.slice(0, -1) + String.fromCharCode(c + j); };
  return str => {
    const s = kata2hira(str); let out = '';
    for (let i = 0; i < s.length; i++) {
      const two = s.substr(i, 2);
      if (yo[two]) { out += yo[two]; i++; continue; }
      const c = s[i];
      if (c === 'ん') { out = addJong(out, 4); continue; }
      if (c === 'っ') { out = addJong(out, 19); continue; }
      out += base[c] ?? c;
    }
    return out;
  };
})();

/* ═══════════════ 저장소 ═══════════════ */
function defaultState() {
  return { v: 1, mode: null, name: '', newPerDay: CFG.DEFAULT_NEW.kid, hangul: true, rate: 0.8,
    srs: {}, streak: { n: 0, last: 0 }, stickers: '', today: { day: 0, newDone: 0, revDone: 0 },
    weak: {},                                                                   // 연습에서 틀린 한자 → 헷갈린 한자 (복습 일정과 별개)
    kana: { m: 'see', sets: { seion: true, daku: false, yoon: false, sp: false } }, kanaW: {},   // 가나 연습 옵션·약한 글자
    kp: { m: 'see', grades: [1, 2, 3, 4, 5, 6] },                              // 한자 연습 옵션
    wp: { m: 'jk', cats: ['n', 'v', 'i', 'na', 'adv', 'etc'], lv: 0, top: 0 }, vocW: {},   // 단어 연습 옵션·약한 단어
    cp: { m: 'make', kinds: ['v'], set: 'basic', lv: 0 } };                     // 활용형 맞히기 옵션
}
let S;
function load() {
  try { S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(CFG.STORE_KEY) || '{}')); }
  catch (e) {
    // 깨진 원본은 지우지 않고 따로 보관 (복구 가능성 유지)
    try { localStorage.setItem(CFG.STORE_KEY + '-broken', localStorage.getItem(CFG.STORE_KEY)); } catch (e2) {}
    S = defaultState(); toast('저장된 진도를 읽지 못해 새로 시작해요');
  }
  Object.values(S.srs).forEach(s => { if (s.lv === undefined) s.lv = s.b >= 1 ? 1 : 0; });
  S.newPerDay = Math.min(S.newPerDay || 4, CFG.NEW_MAX);
  const D0 = defaultState();   // 새로 생긴 옵션 항목 채우기 (이전 버전 진도 호환)
  const sets0 = D0.kana.sets;
  S.kana = Object.assign(D0.kana, S.kana); S.kana.sets = Object.assign(sets0, S.kana.sets);
  S.kp = Object.assign(D0.kp, S.kp); S.wp = Object.assign(D0.wp, S.wp); S.cp = Object.assign(D0.cp, S.cp);
  const d = dayNum();
  if (S.today.day !== d) S.today = { day: d, newDone: 0, revDone: 0, bonus: 0 };
}
function save() {
  try { localStorage.setItem(CFG.STORE_KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠ 저장 공간이 부족해 진도를 저장하지 못했어요'); }
}

/* ═══════════════ 데이터 불러오기 (data/g1.js ~ g6.js, 없는 학년은 '준비 중') ═══════════════ */
const D = { items: [], byK: {}, grades: {}, themes: {} };
const loadScript = src => new Promise(res => {
  const sc = document.createElement('script');
  sc.src = src; sc.onload = () => res(true); sc.onerror = () => res(false);
  document.head.appendChild(sc);
});
function loadGrades() {
  // data/index.js 에 준비된 학년 목록이 있음 → 그 학년만 불러오기
  // index.js는 매번 새로 받고(아주 작은 파일), 학년 파일은 내용 버전을 주소에 붙여 서버 캐시를 피함
  return loadScript('data/index.js?t=' + Date.now()).then(() => {
    const avail = window.KANJI_AVAILABLE || [1], ver = window.KANJI_VER || {};
    return Promise.all(avail.map(g => loadScript(`data/g${g}.js` + (ver[g] ? `?v=${ver[g]}` : ''))));
  }).then(() => {
    const G = window.KANJI_GRADES || {};
    Object.keys(G).map(Number).sort().forEach(g => {
      D.grades[g] = G[g].items; D.themes[g] = G[g].themes;
      G[g].items.forEach(it => { D.items.push(it); D.byK[it.k] = it; });
    });
  });
}

/* ═══════════════ 음성 (아이폰 기본 일본어 음성) ═══════════════ */
let jaVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
  jaVoice = vs.find(v => /Kyoko|O-ren|Otoya|Hattori/i.test(v.name)) || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const canSpeak = () => 'speechSynthesis' in window;
// 가나로만 된 단어(はつか·へや·はな)는 음성 엔진이 첫 は·へ를 조사로 보고 '와·에'로 읽는 일이 있음 → 가타카나로 바꿔 읽힘.
// 단, 끝의 は를 실제로 '와'로 읽는 말(こんにちは·こんばんは·では·じつは·または·もしくは)은 그대로 둠
const ttsText = t => /^[ぁ-ゖー]+$/.test(t) && !/(こんにちは|こんばんは|では|じつは|または|もしくは)$/.test(t) ? t.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)) : t;
function speak(text, rate) {
  if (!canSpeak() || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(ttsText(text));
    u.lang = 'ja-JP'; u.rate = rate || S.rate; if (jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  } catch (e) { toast('발음을 재생하지 못했어요'); }
}
// 가나 한 글자는 음성 엔진이 '아!'처럼 짧게 끊으므로 장음(ー)을 붙여 '아~'로 늘이고 조금 천천히
const isKanaUnit = s => /^[ぁ-ゖァ-ヺ][ぁぃぅぇぉゃゅょァィゥェォャュョ]?$/.test(s);
function speakKana(s) { speak(isKanaUnit(s) ? s + 'ー' : s, Math.min(S.rate, 0.8)); }

// 여러 개를 차례로 읽기 (한자 → 단어 → 문장)
function speakSeq(list) {
  if (!canSpeak() || !list.length) return;
  try {
    speechSynthesis.cancel();
    list.forEach(t => { const u = new SpeechSynthesisUtterance(ttsText(t)); u.lang = 'ja-JP'; u.rate = S.rate; if (jaVoice) u.voice = jaVoice; speechSynthesis.speak(u); });
  } catch (e) { toast('발음을 재생하지 못했어요'); }
}

/* ═══════════════ 뒤로가기 (◀ 버튼) ═══════════════ */
// 화면을 그린 함수와 인자를 기록 → ◀ 누르면 직전 화면을 다시 그리고 스크롤 위치도 되돌림.
// 같은 화면 안에서 탭·이전/다음만 바꾼 것은 기록을 덮어씀 (◀ 한 번에 이전 화면으로).
// 공부 중 화면(문제·새 한자 카드·완료)은 기록하지 않음.
const NAV = [];
let navRec = false, navReplay = false, curRec = false;
function navable(fn, keyOf) {
  const w = function (...args) {
    const key = keyOf(args);
    if (!key) return fn.apply(this, args);
    if (!navReplay) {
      const top = NAV[NAV.length - 1];
      if (curRec && top) top.y = window.scrollY;
      const e = { key, run: () => w(...args), y: 0 };
      if (key === 'Home') NAV.length = 0;
      if (curRec && top && top.key === key) NAV[NAV.length - 1] = e; else NAV.push(e);
    }
    navRec = true;
    try { return fn.apply(this, args); } finally { navRec = false; }
  };
  return w;
}
const inStudy = () => (cur === 'Quiz' || (cur === 'Card' && cardCtx.mode === 'learn')) && SES && !SES.extra;
function goBack() {
  if (inStudy() && !confirm('공부를 멈추고 나갈까요? (푼 문제는 저장돼요)')) return;
  if (curRec) NAV.pop();
  const e = NAV[NAV.length - 1];
  if (!e) { renderHome(); return; }
  navReplay = true;
  try { e.run(); } finally { navReplay = false; }
  const y = e.y; setTimeout(() => window.scrollTo(0, y), 30);   // 다시 그린 뒤 원래 위치로
}
function topbar() {
  $('#topMode').innerHTML = S.mode ? `<span class="pill ${S.mode}">${S.mode === 'kid' ? '🧒 어린이' : '🧑 어른'}</span>` : '';
  $('#topStreak').textContent = S.streak.n ? `🔥${S.streak.n}` : '';
}

/* ═══════════════ 복습 일정 · 숙련도 ═══════════════ */
// 복습 박스(b): 0=오늘 조금 뒤(약 10분 뒤·또는 오늘 다시 열 때) 1=1일 2=3일 3=7일 4=14일 5=30일 6=60일 7=120일
// 숙련도(lv): 1 뜻 → 2 핵심 읽기 → 3 단어 읽기 → 4 듣고 알아보기 → 5 문장에서 읽기
const LV_NAME = ['', '뜻', '핵심 읽기', '단어 읽기', '듣고 알아보기', '문장에서 읽기'];
const st = k => S.srs[k];
const maxLv = it => (it.sent && it.sent.length) ? 5 : 4;          // 예문이 없는 글자는 4단계까지
const lvOf = k => (st(k) && st(k).lv) || 0;
const isUsable = k => lvOf(k) >= 3;                               // '쓸 수 있는 한자' = 단어를 읽을 수 있음
const isMast = k => { const s = st(k), it = D.byK[k]; return !!(s && it && s.lv >= maxLv(it) && s.b >= CFG.MASTER_BOX); };
const isDue = k => !!st(k) && st(k).d <= dayNum();
function dueList() { return D.items.filter(it => isDue(it.k)).sort((a, b) => st(a.k).d - st(b.k).d || st(a.k).b - st(b.k).b); }
function freshList() { return D.items.filter(it => !st(it.k)); }
const newCap = () => Math.min(CFG.NEW_MAX, S.newPerDay + (S.today.bonus || 0));   // 하루 새 한자 상한 10자
function todayPlan() {
  const due = dueList().slice(0, CFG.REVIEW_CAP);
  const nNew = Math.max(0, newCap() - S.today.newDone);
  return { due, fresh: freshList().slice(0, nNew) };
}

let animTok = 0, stepIdx = -1;
function stopAnim() { animTok++; }
function strokeEls() { return [...document.querySelectorAll('#scrCard .strokes path')]; }
function resetStrokes(showAll) {
  strokeEls().forEach(p => { const L = p.getTotalLength(); p.style.transition = 'none'; p.style.strokeDasharray = L; p.style.strokeDashoffset = showAll ? 0 : L; p.classList.remove('cur'); });
}
// 획순 애니메이션: 한 획씩 순서대로 그리기
function playStrokes() {
  stopAnim(); const tok = animTok; resetStrokes(false); stepIdx = -1;
  const ps = strokeEls(); let i = 0;
  const next = () => {
    if (tok !== animTok) return;
    if (i > 0) ps[i - 1].classList.remove('cur');
    if (i >= ps.length) return;
    const p = ps[i], L = p.getTotalLength(), dur = Math.max(350, L * 9);
    p.classList.add('cur'); p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${dur}ms linear`; p.style.strokeDashoffset = 0;
    i++; setTimeout(next, dur + 180);
  };
  setTimeout(next, 200);
}
function stepStroke() {
  stopAnim(); const ps = strokeEls();
  if (stepIdx < 0 || stepIdx >= ps.length - 1) { resetStrokes(false); stepIdx = -1; }
  stepIdx++;
  ps.forEach((p, j) => { p.classList.toggle('cur', j === stepIdx); if (j < stepIdx) { p.style.transition = 'none'; p.style.strokeDashoffset = 0; } });
  const p = ps[stepIdx], L = p.getTotalLength(); p.getBoundingClientRect();
  p.style.transition = `stroke-dashoffset ${Math.max(350, L * 9)}ms linear`; p.style.strokeDashoffset = 0;
  $('#stepInfo').textContent = `${stepIdx + 1} / ${ps.length} 획`;

/* ═══════════════ 한자 검색 (한자 · 히라가나 · 한국 훈음 · 단어) ═══════════════ */
// [의미] 훈의 뜻 부분·뜻·단어 뜻으로 찾기 / [발음] 한국 음(아 → 児·芽·我)·일본어 읽기(よっか → 四日)로 찾기
// 한자를 넣으면 두 탭 모두 그 한자·단어를 찾음
let searchQ = '', searchMode = 'sound';
const koSounds = it => it.hun.split(' ').pop().split('/');                 // '수레 거/차' → ['거','차']
const hunMeaning = it => it.hun.split(' ').slice(0, -1).join(' ');        // '넉 사' → '넉'
const isKanaStr = s => /^[ぁ-ゖァ-ヺー]+$/.test(s);
function searchRows(q) {
  const h = kata2hira(q), res = [];
  const hasHan = /\p{Script=Han}/u.test(q), hangul = /^[가-힣\s]+$/.test(q);
  if (hasHan) {
    D.items.forEach(it => {
      const e = it.ex.find(e => e.w === q) || [...(it.caution || []), ...it.sp].find(e => e.w === q);
      if (e) res.push({ it, sc: 90, why: `${e.w} ${e.y}${e.m ? ' · ' + e.m : ''}` });
      else if (q.includes(it.k)) res.push({ it, sc: 100 - q.indexOf(it.k), why: it.hun });
    });
    return { res };
  }
  if (searchMode === 'sound') {
    if (isKanaStr(q)) {
      D.items.forEach(it => {
        const e = it.ex.find(e => e.y === h) || [...(it.caution || []), ...it.sp].find(e => e.y === h);
        const r = it.rd.find(r => kata2hira(r.stem) === h || kata2hira(r.stem + r.okuri) === h);
        if (e) res.push({ it, sc: 90, why: `${e.w} ${e.y}${e.m ? ' · ' + e.m : ''}` });
        else if (r) res.push({ it, sc: 80, why: `읽기 ${r.r}` });
        else if (h.length >= 2) { const p = it.ex.find(e => e.y.includes(h)); if (p) res.push({ it, sc: 30, why: `${p.w} ${p.y} · ${p.m}` }); }
      });
      return { res };
    }
    if (hangul) {   // 한 글자씩 한국 음으로 (학교 → 학 + 교)
      const syl = [...q.replace(/\s/g, '')], groups = [];
      syl.forEach((s, i) => { if (syl.indexOf(s) !== i) return; const ks = D.items.filter(it => koSounds(it).includes(s)); groups.push({ s, ks }); });
      return { groups };
    }
    return { res, hint: '발음 탭에서는 한글(한국 음) 또는 히라가나·가타카나를 입력하세요.' };
  }
  if (isKanaStr(q)) return { res, hint: '히라가나·가타카나 읽기는 [🔊 발음] 탭에서 찾아요.' };
  D.items.forEach(it => {
    if (it.hun === q) { res.push({ it, sc: 100, why: it.hun }); return; }
    const hm = hunMeaning(it);
    if (hm.includes(q)) { res.push({ it, sc: hm === q ? 80 : 60, why: it.hun }); return; }
    if (it.m.includes(q)) { res.push({ it, sc: 50, why: it.m }); return; }
    const em = it.ex.find(e => e.m.includes(q));
    if (em) res.push({ it, sc: 30, why: `${em.w} ${em.y} · ${em.m}` });
  });
  return { res };
}
function renderSearch() {
  const ph = searchMode === 'sound' ? '예: 아 · 학교 · よっか · がっこう · 四' : '예: 공부 · 물 · 넷 · 배우다 · 学校';
  $('#scrSearch').innerHTML = `<div class="card">
    <div class="seg" style="margin-bottom:10px"><button data-sm="mean" class="grow ${searchMode === 'mean' ? 'on' : ''}">📖 의미로 찾기</button><button data-sm="sound" class="grow ${searchMode === 'sound' ? 'on' : ''}">🔊 발음으로 찾기</button></div>
    <input type="text" id="sq" placeholder="${ph}" value="${esc(searchQ)}" autocomplete="off">
    <p class="muted" style="font-size:.8rem;margin-top:6px">${searchMode === 'sound' ? '한글은 <b>한국 음</b>으로만 찾아요 (아 → 児 아이 아 · 芽 싹 아 …, 뜻에 \'아\'가 든 한자는 제외). 히라가나·가타카나는 일본어 읽기로 찾아요.' : '훈의 <b>뜻 부분</b>·한자 뜻·단어 뜻으로 찾아요 (한국 음은 제외).'}</p></div><div id="sres"></div>`;
  const row = x => `<button class="srow" data-k="${x.it.k}"><span class="c jp" lang="ja">${x.it.k}</span><span class="t"><b>${esc(x.it.hun)}</b> <span class="muted">초${x.it.g}</span><br><span class="jp" lang="ja">${esc(x.why)}</span></span></button>`;

  $('#sq').oninput = () => { clearTimeout(run._t); run._t = setTimeout(run, 150); };
  run();
  show('Search', '🔍 한자 검색');
  if (!navReplay) setTimeout(() => $('#sq').focus(), 50);
}

/* ═══════════════ 문제 만들기 (숙련도 단계별) ═══════════════ */
const poolFor = it => D.items.filter(x => x.g <= Math.max(it.g, 1) && x.k !== it.k);
function distinct(list, keyFn, n, exclude) {

// 그럴듯한 오답 만들기: 같은 한자의 다른 읽기로 바꾸고, 연탁·촉음 변형도 섞음 (四月 → よんがつ · しつき 등)
const DK = {}; 'かが きぎ くぐ けげ こご さざ しじ すず せぜ そぞ ただ ちぢ つづ てで とど はば ひび ふぶ へべ ほぼ'.split(' ').forEach(p => { DK[p[0]] = p[1]; DK[p[1]] = p[0]; });

  if (!s) return out;

  const last = s[s.length - 1];
  if ('くきつち'.includes(last) && s.length > 1) out.add(s.slice(0, -1) + 'っ');
  if (last === 'っ') { out.add(s.slice(0, -1) + 'く'); out.add(s.slice(0, -1) + 'つ'); }

}
function readingOptions(it, e) {
  const pre = e.y.slice(0, e.hs), post = e.y.slice(e.hs + e.hl), seg = e.y.substr(e.hs, e.hl);
  const bad = new Set([e.y, ...it.ex.filter(x => x.w === e.w).map(x => x.y)]);
  const strong = [], weak = [];
  it.rd.forEach(r => { const s = kata2hira(r.stem); if (s !== seg) strong.push(pre + s + post); soundVariants(s).forEach(v => weak.push(pre + v + post)); });
  soundVariants(seg).forEach(v => weak.push(pre + v + post));
  const opts = [];
  for (const y of [...shuffle(strong), ...shuffle(weak)]) { if (opts.length >= 3) break; if (!bad.has(y) && !opts.includes(y) && y.length) opts.push(y); }
  // 부족하면 다른 한자의 읽기로 채움
  const pool = shuffle(poolFor(it).flatMap(x => x.rd.filter(r => !r.rare).map(r => kata2hira(r.stem))));
  for (const s of pool) { if (opts.length >= 3) break; const y = pre + s + post; if (!bad.has(y) && !opts.includes(y)) opts.push(y); }

}
const kanaChoice = y => `<span class="jp" lang="ja">${esc(y)}</span>${S.hangul ? `<small>${KH(y)}</small>` : ''}`;
function pickEx(it, pref) {

  if (lv >= 3 && !pickEx(it)) lv = 2;                        // 읽기 문제로 쓸 단어가 없으면 핵심 읽기로
  if (lv === 5) {                                            // 5 문장에서 읽기

        choices: shuffle([{ html: kanaChoice(e.y), ok: true }, ...opts.map(y => ({ html: kanaChoice(y) }))]), cls: '', say: s.j, sayAfter: true,

        choices: shuffle([{ html: esc(e.m), ok: true }, ...ds.map(x => ({ html: esc(x.m) }))]), cls: '', say: e.y, sayAfter: true, after: `<p class="qsub jp" lang="ja">${esc(e.w)} = ${esc(e.y)}</p>` };
    }
    const opts = readingOptions(it, e);
    return { t: 'wordRead', lv, ask: '이 단어는 어떻게 읽을까요?', body: `<div class="qword jp" lang="ja">${esc(e.w)}</div><div class="qsub">${esc(e.m)}</div>`,
      choices: shuffle([{ html: kanaChoice(e.y), ok: true }, ...opts.map(y => ({ html: kanaChoice(y) }))]), cls: '', say: e.y, sayAfter: true,
      after: e.kr ? `<p class="krnote">⚠️ ${esc(e.kr)}</p>` : '' };

      return { t: 'coreRead', lv, ask: `이 한자의 대표 ${r.on ? '음독' : '훈독'}은?`, body: `<div class="qbig jp" lang="ja">${it.k}</div>`,
        choices: shuffle([{ html: show(r), ok: true, say: kata2hira(r.stem + r.okuri) }, ...ds.map(x => ({ html: show(x) }))]).map(c => ({ ...c, html: `<span class="jp" lang="ja">${c.html}</span>${S.hangul ? `<small>${KH(c.html.replace(/<[^>]+>/g, ''))}</small>` : ''}` })),
        cls: '', say: kata2hira(r.stem + r.okuri), sayAfter: true };
    }
  }
  // 1 뜻 (한자 → 뜻 / 뜻 → 한자)
  if (Math.random() < 0.3) {
    const ds = distinct(pool, x => x.k, 3, [it.k]);
    return { t: 'reverse', lv: 1, ask: '이 뜻의 한자는?', body: `<div class="qhun">${esc(it.hun)}</div><div class="qsub">${esc(it.m)}</div>`,
      choices: shuffle([{ html: it.k, ok: true }, ...ds.map(x => ({ html: x.k }))]), cls: 'kan', say: null };
  }
  const ds = distinct(pool, x => x.hun, 3, [it.hun]);

    choices: shuffle([{ html: `${esc(it.hun)}<small>${esc(it.m)}</small>`, ok: true }, ...ds.map(x => ({ html: `${esc(x.hun)}<small>${esc(x.m)}</small>` }))]), cls: '', say: null };

/* ═══════════════ 공부 세션: 복습 먼저 → 새 한자 → 조금 뒤 한 번 더 ═══════════════ */
let SES = null;
function quizLevel(item) {
  const it = D.byK[item.k];
  if (item.isNew) return 1;
  if (item.roundup) return Math.min(2, maxLv(it));
  if (item.practice) return Math.max(1, Math.min(maxLv(it), 1 + Math.floor(Math.random() * Math.max(1, lvOf(item.k) + 1))));
  if (item.retry) return item.level || 1;

}
function startSession() {
  const { due, fresh } = todayPlan();
  if (!due.length && !fresh.length) { renderHome(); return; }
  const q = [];
  due.forEach(it => q.push({ t: 'quiz', k: it.k }));                                  // ① 복습 먼저
  fresh.forEach(it => { q.push({ t: 'learn', k: it.k }); q.push({ t: 'quiz', k: it.k, isNew: true }); });   // ② 새 한자
  shuffle(fresh.slice()).forEach(it => q.push({ t: 'quiz', k: it.k, roundup: true }));  // ③ 조금 뒤 한 번 더 (≈10분 단계)
  SES = { q, pos: 0, ok: 0, ng: 0, newKs: fresh.map(i => i.k), revN: due.length, extra: false, up: {} };
  stepSession();
}
function startExtra() {
  // 복습에서 틀린 한자 + 한자 연습에서 틀린 한자(S.weak)
  const score = it => { const s = st(it.k); return (s ? s.w / (s.c + 1) : 0) + (S.weak[it.k] || 0); };
  const weak = D.items.filter(it => (st(it.k) && st(it.k).w > 0) || S.weak[it.k]).sort((a, b) => score(b) - score(a)).slice(0, 12);
  const pool = weak.length ? weak : D.items.filter(it => st(it.k)).slice(-12);
  if (!pool.length) { toast('먼저 오늘의 공부로 한자를 배워 보세요!'); return; }
  SES = { q: shuffle(pool.slice()).map(it => ({ t: 'quiz', k: it.k, practice: true })), pos: 0, ok: 0, ng: 0, newKs: [], revN: 0, extra: true, up: {} };
  stepSession();
}
function stepSession() {
  if (SES.pos >= SES.q.length) return finishSession();
  const item = SES.q[SES.pos];
  if (item.t === 'learn') renderCard(item.k, 'learn', () => { SES.pos++; stepSession(); });
  else renderQuiz(item);
}
function noteWeak(k, ok) {   // 연습 결과: 틀리면 헷갈린 한자에 추가, 맞히면 하나 덜어냄 (복습 일정은 그대로)

}
function grade(item, ok, level) {
  const today = dayNum(), I = CFG.INTERVALS, top = I.length - 1;
  if (item.practice) {
    noteWeak(item.k, ok);
    if (!S.srs[item.k]) { ok ? SES.ok++ : SES.ng++; save(); return; }   // 아직 안 배운 한자는 복습 일정에 넣지 않음
  }
  const s = S.srs[item.k] || (S.srs[item.k] = { b: 0, d: today, c: 0, w: 0, f: today, lv: 0 });
  ok ? s.c++ : s.w++;
  const before = s.lv || 0;
  if (item.practice) { /* 자유 연습: 일정·숙련도 변화 없음 */ }
  else if (item.retry) { if (ok && s.b === 0) { s.b = 1; s.d = today + 1; } }       // 오늘 다시 맞히면 내일로
  else if (item.isNew) { if (ok) s.lv = Math.max(before, level); s.b = 0; s.d = today; S.today.newDone++; }
  else if (ok) { s.lv = Math.max(before, level); s.b = Math.min(s.b + 1, top); s.d = today + I[s.b]; if (!item.roundup) S.today.revDone++; }
  else { s.b = Math.max(0, s.b - 1); s.d = today + I[s.b]; if (!item.roundup) S.today.revDone++; }   // 틀리면 한 단계만 내려감
  if ((s.lv || 0) > before) SES.up[item.k] = s.lv;   // 한자별 최종 단계만
  if (!ok && !item.practice) SES.q.splice(Math.min(SES.pos + 1 + CFG.RETRY_GAP, SES.q.length), 0, { t: 'quiz', k: item.k, retry: true, level });

  const tag = item.isNew ? '✨ 새 한자' : item.retry ? '🔁 다시 한 번' : item.roundup ? '🌙 조금 뒤 한 번 더' : item.practice ? '🔁 연습' : '📅 복습';

    <div class="fb" id="qfb"></div>

    if (Q.sayAfter && Q.say) speak(Q.say);
    grade(item, ok, Q.lv);
    $('#qafter').innerHTML = `${Q.after || ''}${ok ? '' : `<button class="btn ghost" id="qCard" style="margin:10px 0"><span class="jp" lang="ja">${it.k}</span> 카드 다시 보기</button>`}<button class="btn main" id="qNext" style="margin-top:10px">다음 ▶</button>`;
    if (!ok) $('#qCard').onclick = () => renderCard(it.k, 'learn', () => { SES.pos++; stepSession(); });

function finishSession() {

        <table class="t">${c.ys.map((y, i) => `<tr class="${c.st.includes(i + 1) ? 'star' : ''}"><td>${i + 1}</td><td><button class="jp ex" lang="ja" data-say="${y}" style="padding:2px">${y}${kh(y)}</button></td><td>${c.st.includes(i + 1) ? '★' : ''}</td></tr>`).join('')}</table></details>`).join('') + '</div>';
  } else {
    body = sh.sec.map(s => `<div class="card"><h2>${esc(s.h)}</h2>${s.d ? `<p class="muted" style="margin-bottom:6px">${esc(s.d)}</p>` : ''}
      <table class="t">${s.rows.map(([w, y, m, star]) => `<tr class="${star ? 'star' : ''}"><td class="jp" lang="ja" style="${w.length > 7 ? 'font-size:1.05rem;word-break:break-all' : 'font-size:1.25rem;white-space:nowrap'}">${esc(w)}</td>
        <td><button class="jp ex" lang="ja" data-say="${y}" style="padding:2px;text-align:left">${esc(y)}${kh(y)}</button></td><td>${esc(m)}${star ? ' ★' : ''}</td></tr>`).join('')}</table></div>`).join('');

/* ═══════════════ 가나 획순 (표에서 글자를 누르면 아래에 획순이 그려짐) ═══════════════ */
let ksTok = 0;

        <g class="ghost">${K[c].map(d => `<path d="${d}"/>`).join('')}</g><g class="strokes">${K[c].map(d => `<path d="${d}"/>`).join('')}</g><g class="nums"></g></svg>`).join('')}</div>

function drawKana(box) {
  const tok = ++ksTok, ps = [...box.querySelectorAll('.strokes path')];
  ps.forEach(p => { const L = p.getTotalLength(); p.style.transition = 'none'; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.classList.remove('cur'); });
  box.querySelectorAll('svg').forEach(svg => {
    svg.querySelector('.nums').innerHTML = [...svg.querySelectorAll('.strokes path')].map((p, i) => { const pt = p.getPointAtLength(0); return `<text x="${pt.x - 4}" y="${pt.y - 2}">${i + 1}</text>`; }).join('');
  });
  let i = 0;
  const next = () => {
    if (tok !== ksTok) return;
    if (i > 0) ps[i - 1].classList.remove('cur');
    if (i >= ps.length) return;
    const p = ps[i], L = p.getTotalLength(), dur = Math.max(350, L * 9);
    p.classList.add('cur'); p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${dur}ms linear`; p.style.strokeDashoffset = 0;
    i++; setTimeout(next, dur + 180);

/* ═══════════════ 연습 공용: 문제 하나 보여 주고 채점 (무한 연습) ═══════════════ */
// Q = { ask, body, choices:[{html, ok}], cls, say, sayFn, sayFirst, sayAfter, after }
function practiceQ(box, Q, { onResult, next, cardK }) {

  box.innerHTML = `<div class="qask">${esc(Q.ask)}</div>${Q.body}
    <div class="choices">${Q.choices.map((c, i) => `<button class="choice ${Q.cls || ''} ${Q.cls === 'kan' ? 'jp' : ''}" ${Q.cls === 'kan' ? 'lang="ja"' : ''} data-i="${i}">${c.html}</button>`).join('')}</div>
    <div class="fb" id="pfb"></div><div id="pafter"></div>`;
  const spk = box.querySelector('#qSpk');
  if (spk) spk.onclick = () => say(Q.say);
  if (Q.sayFirst) say(Q.say);
  const peek = box.querySelector('#qPeek');
  if (peek) peek.onclick = () => { box.querySelector('#qPeekT').style.display = 'inline'; peek.style.display = 'none'; };
  let answered = false;
  box.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if (answered) return; answered = true;
    const ok = !!Q.choices[+b.dataset.i].ok;
    box.querySelectorAll('.choice').forEach(x => { if (Q.choices[+x.dataset.i].ok) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    const fb = box.querySelector('#pfb'); fb.className = 'fb ' + (ok ? 'ok' : 'ng'); fb.textContent = ok ? pick(['⭕ 정답!', '⭕ 잘했어요!', '⭕ 맞았어요!']) : '❌ 아쉬워요!';
    if (Q.sayAfter && Q.say) say(Q.say);
    onResult(ok);
    box.querySelector('#pafter').innerHTML = `${Q.after || ''}${!ok && cardK ? `<button class="btn ghost" id="pCard" style="margin-top:10px"><span class="jp" lang="ja">${cardK}</span> 카드 보기</button>` : ''}<button class="btn main" id="pNext" style="margin-top:10px">다음 ▶</button>`;
    if (box.querySelector('#pCard')) box.querySelector('#pCard').onclick = () => renderCard(cardK, 'browse');
    let t = 0;
    box.querySelector('#pNext').onclick = () => { clearTimeout(t); next(); };
    if (ok) t = setTimeout(next, Q.sayAfter ? 1400 : 900);   // 맞히면 저절로 다음 문제
  });
}
const wpick = (arr, wf) => { const ws = arr.map(wf), tot = ws.reduce((a, b) => a + b, 0); let r = Math.random() * tot; for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; } return arr[arr.length - 1]; };
const speakerHTML = peekText => `<button class="speaker" id="qSpk">🔊</button><div class="qsub"><button class="btn ghost" id="qPeek" style="display:inline-block;width:auto;padding:6px 14px;font-size:.85rem">👀 글자로 보기</button> <span class="jp" lang="ja" id="qPeekT" style="display:none">${peekText}</span></div>`;

/* ═══════════════ 가나 연습 (히라가나·가타카나, 무한) ═══════════════ */
const KSETS = {
  seion: KANA.seion.join('').replace(/・/g, '').split(''),     // 46
  daku: KANA.daku.join('').split(''),                          // 25
  yoon: KANA.yoon.join('').match(/.[ゃゅょ]/g)                 // 33
};
// 특수 표기: 촉음(っ)·발음(ん)·장음이 든 짧은 말 / 가타카나는 외래어 표기(ファ 등)와 장음(ー)
const KSP = {
  hira: ['きって', 'ざっし', 'きっぷ', 'がっこう', 'いっしょ', 'ちょっと', 'はっぱ', 'おかあさん', 'おとうさん', 'おにいさん', 'おねえさん', 'せんせい', 'ぎゅうにゅう', 'りょこう', 'でんしゃ', 'きんぎょ', 'ほんや', 'こうえん'],
  kata: [...KANA.gairai.map(g => g[0]), 'ビデオ', 'コーヒー', 'ケーキ', 'スープ', 'ノート', 'ゲーム', 'カード', 'ボール', 'ベッド', 'カップ', 'サッカー', 'チーズ', 'パーティー', 'フォーク', 'ファイル', 'メール']
};
const GAIRAI_LB = Object.fromEntries(KANA.gairai);
// 가나 → 한글 보기. ん은 받침이라 따로, 외래어 표기는 (fa)처럼 구별해 パ(파)와 겹치지 않게
function kLabel(u) {
  if (GAIRAI_LB[u]) return GAIRAI_LB[u];
  if (u === 'ん' || u === 'ン') return 'ㄴ(응)';
  return KH(u);
}
// 모양이 비슷해 헷갈리는 글자 (보고 맞히기 오답으로 우선 사용)
const KVIS = ['あお', 'ぬめ', 'ねれわ', 'るろ', 'はほ', 'さちき', 'いり', 'うら', 'こに', 'たな', 'けは', 'しつ', 'まも', 'くへ',
  'シツ', 'ソンリ', 'ノメ', 'クタケ', 'ワウ', 'チテ', 'コユロ', 'マア', 'ヌス', 'ラヲ', 'セヤ', 'オホ'];
const KROW = (() => {   // 글자 → 같은 행(자음)·같은 단(모음)
  const m = {};
  [...KANA.seion, ...KANA.daku].forEach((r, ri) => [...r].forEach((c, ci) => { if (c !== '・') m[c] = { r: 'r' + ri, c: ci }; }));
  KSETS.yoon.forEach(y => { m[y] = { r: 'y' + y[0], c: 'ゃゅょ'.indexOf(y[1]) + 10 }; });
  return m;
})();
function kanaDistract(u, pool, method) {
  const lb = kLabel(u), used = new Set([lb]), out = [], H = kata2hira(u), info = KROW[H];
  const add = x => { if (out.length >= 3 || !x || x === u || !pool.includes(x)) return; const l = kLabel(x); if (!used.has(l)) { used.add(l); out.push(x); } };
  const conv = h => /[ァ-ヺ]/.test(u) ? hira2kata(h) : h;
  if (method === 'see') KVIS.filter(g => g.includes(u)).forEach(g => shuffle([...g]).forEach(add));
  if (DK[H[0]]) add(conv(DK[H[0]] + H.slice(1)));                             // か ↔ が
  if (info) {
    shuffle(pool.filter(x => { const i = KROW[kata2hira(x)]; return i && (i.r === info.r || i.c === info.c); })).slice(0, 4).forEach(x => { if (out.length < 2) add(x); });
  }
  shuffle(pool.slice()).forEach(add);
  return out;
}
// 특수 표기 말의 그럴듯한 오답: っ 빼기/넣기 · 장음 빼기 · 탁음 바꾸기 · 요음을 큰 글자로
function wordVariants(w) {
  const kat = /[ァ-ヺ]/.test(w), H = kata2hira(w), out = new Set();
  const put = s => { if (s && s !== H) out.add(kat ? hira2kata(s) : s); };
  if (H.includes('っ')) put(H.replace('っ', '')); else if (H.length >= 3) put(H[0] + 'っ' + H.slice(1));
  if (H.includes('ー')) put(H.replace('ー', ''));
  const LONG = { う: 'おこそとのほもよろごぞどぼぽょ', い: 'えけせてねへめれげぜでべぺ', あ: 'あかさたなはまやらわがざだばぱゃ' };
  for (let i = 1; i < H.length; i++) if (LONG[H[i]] && LONG[H[i]].includes(H[i - 1])) { put(H.slice(0, i) + H.slice(i + 1)); break; }
  [...H].forEach((c, i) => { if (DK[c]) put(H.slice(0, i) + DK[c] + H.slice(i + 1)); });
  if (H.includes('ん')) put(H.replace('ん', ''));
  const ys = H.search(/[ゃゅょ]/); if (ys > 0) put(H.slice(0, ys) + { ゃ: 'や', ゅ: 'ゆ', ょ: 'よ' }[H[ys]] + H.slice(ys + 1));
  return shuffle([...out]);
}
const isKanaWord = u => [...u].length > 2 || u.includes('ー');
function kanaPool(script) {
  const o = S.kana.sets, K = script === 'kata' ? hira2kata : (s => s), p = [];
  if (o.seion) p.push(...KSETS.seion.map(K));
  if (o.daku) p.push(...KSETS.daku.map(K));
  if (o.yoon) p.push(...KSETS.yoon.map(K));
  if (o.sp) p.push(...KSP[script]);

}
function kanaQ(u, pool, method) {
  const word = isKanaWord(u);
  let ds;
  if (word) {
    const lb = kLabel(u), used = new Set([lb]); ds = [];
    [...wordVariants(u), ...shuffle(pool.filter(isKanaWord))].forEach(x => { if (ds.length < 3 && x !== u && !used.has(kLabel(x))) { used.add(kLabel(x)); ds.push(x); } });
  } else ds = kanaDistract(u, pool.filter(x => !isKanaWord(x)), method);
  const opts = shuffle([u, ...ds]);
  if (method === 'hear') {
    return { ask: '잘 듣고 알맞은 글자를 고르세요', body: speakerHTML(esc(kLabel(u))), say: u, sayFn: speakKana, sayFirst: true,
      choices: opts.map(x => ({ html: `<span class="jp" lang="ja" style="font-size:${word ? 1.5 : 2.4}rem">${esc(x)}</span>`, ok: x === u })) };
  }
  return { ask: '이 글자는 어떻게 읽을까요?', body: `<div class="${word ? 'pword' : 'pbig'} jp" lang="ja">${esc(u)}</div>`, say: u, sayFn: speakKana, sayAfter: true,
    choices: opts.map(x => ({ html: esc(kLabel(x)), ok: x === u })) };
}
let KP = null;   // 이번 연습의 점수 { script, ok, ng, run, last }
function renderKana(script) {
  script = script || (KP && KP.script) || 'hira';
  if (!KP || KP.script !== script) KP = { script, ok: 0, ng: 0, run: 0, last: '' };
  const o = S.kana, nm = script === 'kata' ? '가타카나' : '히라가나';
  const SETS = [['seion', '청음'], ['daku', '탁음·반탁음'], ['yoon', '요음'], ['sp', script === 'kata' ? '특수 표기·장음' : '특수 표기(っ·ん·장음)']];
  $('#scrKana').innerHTML = `<div class="card">
    <div class="optrow"><span class="lab">풀이 방법</span><div class="seg"><button data-km="see" class="${o.m === 'see' ? 'on' : ''}">👁️ 보고 맞히기</button><button data-km="hear" class="${o.m === 'hear' ? 'on' : ''}">👂 듣고 맞히기</button></div></div>
    <div class="optrow"><span class="lab">범위</span>${SETS.map(([id, t]) => `<button class="tog ${o.sets[id] ? 'on' : ''}" data-ks="${id}">${o.sets[id] ? '✓ ' : ''}${t}</button>`).join('')}</div>
    <div class="pstat" id="kStat"></div></div>
    <div class="card" id="kQ"></div>`;
  $('#scrKana').querySelectorAll('[data-km]').forEach(b => b.onclick = () => { S.kana.m = b.dataset.km; save(); renderKana(script); });
  $('#scrKana').querySelectorAll('[data-ks]').forEach(b => b.onclick = () => {
    const id = b.dataset.ks;
    if (o.sets[id] && Object.values(o.sets).filter(Boolean).length === 1) { toast('하나 이상 골라야 해요'); return; }
    o.sets[id] = !o.sets[id]; save(); renderKana(script);
  });

}
function kanaStat() { $('#kStat').innerHTML = `<span style="color:var(--ok)">⭕ ${KP.ok}</span><span style="color:var(--ng)">❌ ${KP.ng}</span><span>🔥 연속 ${KP.run}</span>`; }
function nextKana() {
  const pool = kanaPool(KP.script), m = S.kana.m;
  if (m === 'hear' && !canSpeak()) { $('#kQ').innerHTML = '<p class="muted">이 기기는 음성을 지원하지 않아 듣고 맞히기를 할 수 없어요.</p>'; return; }
  const cand = pool.length > 1 ? pool.filter(x => x !== KP.last) : pool;
  const u = wpick(cand, x => S.kanaW[x] || 1);
  KP.last = u;
  practiceQ($('#kQ'), kanaQ(u, pool, m), {
    onResult: ok => {
      ok ? (KP.ok++, KP.run++) : (KP.ng++, KP.run = 0);
      const w = S.kanaW[u] || 1;
      if (ok) { if (w > 1) S.kanaW[u] = Math.max(1, w - 0.5); if (S.kanaW[u] === 1) delete S.kanaW[u]; }
      else S.kanaW[u] = Math.min(8, w + 2);          // 틀린 글자는 더 자주

/* ═══════════════ 한자 연습 (무한 · 학년 선택 · 복습 일정은 그대로) ═══════════════ */
let KPS = null;   // { ok, ng, run, last }
const kpPool = () => D.items.filter(it => S.kp.grades.includes(it.g));
function renderKprac() {

    <div class="pstat" id="pStat"></div></div>
    <div class="card" id="pQ"></div>`;
  $('#scrKprac').querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { S.kp.m = b.dataset.pm; save(); renderKprac(); });

// 활용 엔진: 사전형·그룹만 주면 규칙으로 모든 활용형을 만듦 (표기·읽기 함께)

const gsh = (c, to) => GROW[to][GROW.u.indexOf(c)];

function conjVerb(w, y, g) {

    <p class="muted" style="font-size:.8rem">기본 4가지 = 동사 ます·ない·た·て형 / 형용사 부정·과거·て형·부사(명사 꾸미기). 오답 보기는 실제로 많이 하는 실수(書くます·帰て·高いじゃない·きれくない)로 만들어요.</p>
    <div class="pstat" id="cStat"></div></div>
    <div class="card" id="cQ"></div>`;
  const sc = $('#scrCprac');
  sc.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => { o.m = b.dataset.cm; save(); renderCprac(); });
  sc.querySelectorAll('[data-ck]').forEach(b => b.onclick = () => { o.kinds = toggleSet(o.kinds, ['v', 'i', 'na'], b.dataset.ck); save(); renderCprac(); });
  sc.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => { o.set = b.dataset.cs; save(); renderCprac(); });
  sc.querySelectorAll('[data-cl]').forEach(b => b.onclick = () => { o.lv = +b.dataset.cl; save(); renderCprac(); });
  cStat(); nextCprac();
  show('Cprac', '✏️ 활용형 맞히기');
}
function cStat() { $('#cStat').innerHTML = `<span style="color:var(--ok)">⭕ ${CPS.ok}</span><span style="color:var(--ng)">❌ ${CPS.ng}</span><span>🔥 연속 ${CPS.run}</span>`; }
function nextCprac() {
  const pool = cpPool();
  if (!pool.length) { $('#cQ').innerHTML = '<p class="muted">고른 조건에 맞는 단어가 없어요.</p>'; return; }
  let e, Q = null;
  for (let i = 0; i < 20 && !Q; i++) {
    const cand = pool.length > 1 ? pool.filter(x => x.w !== CPS.last) : pool;
    e = pick(cand); Q = cpracQ(e);
  }
  if (!Q) { $('#cQ').innerHTML = '<p class="muted">문제를 만들지 못했어요. 범위를 바꿔 보세요.</p>'; return; }
  CPS.last = e.w;
  practiceQ($('#cQ'), Q, {
    onResult: ok => { ok ? (CPS.ok++, CPS.run++) : (CPS.ng++, CPS.run = 0); cStat(); },
    next: () => { if (cur === 'Cprac') nextCprac(); }
  });
  $('#cQ').querySelectorAll('.kl').forEach(b => b.onclick = ev => { ev.stopPropagation(); renderCard(b.dataset.k, 'browse'); });
}

/* ═══════════════ 읽기 규칙 (한국음 ↔ 음독, 소리 가족 사전) ═══════════════ */
// 1026자의 구성(p)에서 "X(… 소리 ○○)"를 찾아 같은 소리 부품끼리 묶음
function soundFamilies() {
  const fam = {};
  D.items.forEach(it => {
    // 소리 부품은 한자만 인정 (예: "売 모양(원래 …, 소리 ゾク)"의 '양' 같은 한글이 잡히지 않게)
    const m = it.p.match(/(\p{Script=Han})\((?:[^()]*?[,，]\s*)?소리\s*([ァ-ヶー]+)/u);
    if (!m) return;
    const part = m[1], on = it.rd.filter(r => r.on).map(r => r.stem);
    (fam[part] = fam[part] || { part, snd: m[2], ks: [] }).ks.push({ k: it.k, on: on[0] || '', g: it.g });
  });
  return Object.values(fam).filter(f => f.ks.length >= 2).sort((a, b) => b.ks.length - a.ks.length);
}
function renderRules() {
  const fams = soundFamilies();
  $('#scrRules').innerHTML = `
    <div class="card"><h2>🇰🇷 한국 한자음으로 음독 맞히기</h2>
      <p class="muted">한국어를 쓰는 우리만의 비밀 무기! 한국 음의 <b>받침</b>을 보면 일본 음독의 끝소리를 짐작할 수 있어요. (대부분 맞지만 예외도 있어요)</p>
      <table class="t"><tr><th>한국 받침</th><th>일본 음독 끝</th><th>예</th></tr>
      <tr><td>ㄱ</td><td>く·き</td><td class="jp" lang="ja">学 학→ガク, 木 목→モク, 石 석→セキ</td></tr>
      <tr><td>ㄹ</td><td>つ·ち</td><td class="jp" lang="ja">月 월→ゲツ, 日 일→ニチ, 出 출→シュツ</td></tr>
      <tr><td>ㅂ</td><td>う (길게)</td><td class="jp" lang="ja">入 입→ニュウ, 十 십→ジュウ<br><span class="muted">예외: 立 립→リツ</span></td></tr>
      <tr><td>ㅇ</td><td>う·い (길게)</td><td class="jp" lang="ja">生 생→セイ, 王 왕→オウ, 上 상→ジョウ</td></tr>
      <tr><td>ㄴ·ㅁ</td><td>ん</td><td class="jp" lang="ja">山 산→サン, 人 인→ジン, 音 음→オン</td></tr>
      <tr><td>받침 없음</td><td>대체로 그대로</td><td class="jp" lang="ja">火 화→カ, 水 수→スイ, 子 자→シ</td></tr></table></div>
    <div class="card"><h2>🧩 소리 가족 사전 (${fams.length}가족)</h2>
      <p class="muted">'뜻 부분 + 소리 부분'으로 된 한자(형성자)는 소리 부분이 같으면 음독도 비슷해요. 초등 한자 1026자에서 자동으로 모았어요. 가족을 누르면 펼쳐져요.</p>
      ${fams.map(f => `<details class="cnt"><summary><span class="jp" lang="ja" style="font-size:1.4rem">${esc(f.part)}</span> <span class="jp" lang="ja">${esc(f.snd)}</span> 가족 · ${f.ks.length}자</summary>
        <div class="grid" style="margin-top:8px">${f.ks.map(x => `<button class="tile" data-k="${x.k}"><div class="c jp" lang="ja">${x.k}</div><div class="h jp" lang="ja">${esc(x.on)} · ${x.g}학년</div></button>`).join('')}</div></details>`).join('')}</div>
    <div class="card"><p>📋 날짜·숫자·세는 말은 <b>한 장 정리</b>에 모았어요.</p><button class="btn sub" id="goSheet2" style="margin-top:8px">📋 한 장 정리로 가기</button></div>`;
  $('#scrRules').querySelectorAll('.tile').forEach(b => b.onclick = () => renderCard(b.dataset.k, 'browse'));
  $('#goSheet2').onclick = () => renderSheet();
  show('Rules', '🧩 읽기 규칙');
}

    <div class="set"><span>모드</span><div class="seg"><button data-m="kid" class="${S.mode === 'kid' ? 'on' : ''}">🧒 어린이</button><button data-m="adult" class="${S.mode === 'adult' ? 'on' : ''}">🧑 어른</button></div></div>

      한자 목록·학년: 文部科学省 「学年別漢字配当表」(2020 시행) · 음훈: 文化庁 「常用漢字表」(2010)<br>
      한자·가나 획순: <b>KanjiVG</b> © Ulrich Apel, CC BY-SA 3.0 · 일본어 글꼴: <b>Klee One</b> © Fontworks, SIL OFL 1.1 · 한국 한자음 대조: <b>KANJIDIC2</b> © EDRDG, CC BY-SA 4.0<br>
      단어장 N5·N4 목록: Jonathan Waller, <b>tanos.co.uk</b> (CC BY) · 품사·빈도·동사 그룹 확인: <b>JMdict</b> © EDRDG, CC BY-SA 4.0 · 한국어 뜻·문법 설명: 이 앱에서 작성<br>

  const s = $('#scrSet');

  $('#nMinus').onclick = () => { S.newPerDay = Math.max(1, S.newPerDay - 1); save(); $('#nVal').textContent = S.newPerDay; };
  $('#nPlus').onclick = () => { S.newPerDay = Math.min(CFG.NEW_MAX, S.newPerDay + 1); save(); $('#nVal').textContent = S.newPerDay; };
  s.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { S.hangul = b.dataset.h === '1'; save(); renderSet(); });

  $('#sTest').onclick = () => { speak('こんにちは'); $('#sVoice').textContent = !canSpeak() ? '이 기기는 음성 합성을 지원하지 않아요' : jaVoice ? `목소리: ${jaVoice.name}` : '일본어 목소리를 찾지 못했어요. 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성에서 일본어를 받아 주세요.'; };
  $('#bExp').onclick = async () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));

  };
  $('#bImp').onclick = () => {
    try {
      const obj = JSON.parse(decodeURIComponent(escape(atob($('#bTxt').value.trim()))));

  };

function setMode(m, first) {

}
